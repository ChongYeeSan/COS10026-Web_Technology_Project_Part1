<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply</title>
</head>
<body>
    
    <h1>Job Application Form</h1>
    <br>
    <p>Please fill in the form to apply for a position with our company.</p>
    <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
        <label for="jrefer">Job reference number:</label>
        <input type="int" id="jrefer" name="jrefer" required>
        <br>
        <label for="fname">First name:</label>
        <input type="text" id="fname" name="fname" required [pattern="[A-Za-z ]">
        <br>
        <label for="lname">Last name:</label>
        <input type="text" id="lname" name="lname" required [pattern="[A-Za-z ]">
        <br>
    </form>

    
</body>
</html>
