<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>
<body class="apply-page">
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Job</a></li>
            <li><a href="apply.html">Apply</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <div class="container">
    <img src="images/logo.jpeg" alt="Ecopower-logo" style="width:80px;height:50px;" class="logo">
    <span class="text">Ecopower</span>
    </div>
    <hr class="thick-line">
    <h1>Submit Your Application</h1>
    <h2>Start Your Career in Sustainable Energy</h2>

    <br>
    <!-- <p>Please fill in the form to apply for a position with our company.</p> -->
    <form class="form-group" action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
        <div class="form-group">
            <label for="jrefer">Job reference number:</label>
            <input type="int" id="jrefer" name="jrefer" required></div>
        <br>
        <div class="form-group">
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname" [pattern="[A-Za-z ]+" required></div>
        <br>
        <div class="form-group">
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname" [pattern="[A-Za-z ]+" required></div>
        <br>
        <div class="form-group">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required></div>
        <br>

        <fieldset class="form-group">
            <label for="gender">Gender:</label required>
            <input type="radio" id="gender" name="gender" value="Male">
            <label for="gender">Male</label>
            <input type="radio" id="gender" name="gender" value="Female">
            <label for="gender">Female</label>
        </fieldset>

        <br>
        <div class="form-group">
            <label for="address">Street Address:</label>
            <input type="text" id="address" name="address" required></div>
        <br>
        <div class="form-group">
            <label for="suburb-town">Suburb/Town:</label>
            <input type="text" id="suburb-town" name="suburb-town" required></div>
        <br>
        <div class="form-group">
            <label for="state">State:</label required>
            <select name="states" id="state">
                <option value="victora">VIC</option>
                <option value="nsw">NSW</option>
                <option value="qld">QLD</option>
                <option value="nt">NT</option>
                <option value="wa">WA</option>
                <option value="sa">SA</option>
                <option value="tas">TAS</option>
                <option value="act">ACT</option>
            </select>
        </div>

        <br>
        <div class="form-group">
            <label for="pcode">Postcode:</label>
            <input type="int" id="pcode" name="pcode" pattern= "[0-9]{4}" required></div>
        <br>
        <div class="form-group">
            <label for="Email">Email Address:</label>
            <input type="email" id="Email" name="Email" required [pattern="[A-Za-z ]">
        <br>
        <div class="form-group">
            <label for="pnum">Phone Number:</label required>
            <input type="int" id="pnum" name="pnum">
        <br>
        <fieldset class="form-group">
            <legend>Skill list:</legend required>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Programming</label>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Data Entry</label>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Data Analytics</label>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Communication</label>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Teamwork</label>
            <input type="checkbox" id="skill-list1" name="skill-list1" value="programming">
            <label for="skills">Time Management</label>
        </fieldset>
        <br>
        <div class="form-group">
            <label for="others">Other skills:</label>
            <textarea id="others" name="others" rows="2"></textarea><br><br>
        </div>

        <div class="form-group">
            <input type="submit" value="Submit"><br>
            <input type="reset" value="Reset Form">
        </div>
    </form>

    
</body>
</html>
